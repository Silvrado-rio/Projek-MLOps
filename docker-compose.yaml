name: manhwa-lk10
services:
  mlflow-server:
    restart: unless-stopped
    build:
      context: .
      target: tracking
    environment:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      MODEL_STAGE: Production
    ports:
    - 127.0.0.1:5001:5000
    volumes:
    - mlflow-data:/mlflow
    networks:
    - model-network
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import pathlib, urllib.request; pathlib.Path('/tmp/model-ready').stat(); urllib.request.urlopen('http://127.0.0.1:5000/api/2.0/mlflow/registered-models/alias?name=manhwa-growth-ridge-compose&alias=production',
        timeout=5)
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 24
    init: true
  api-service:
    image: manhwa-growth-mlflow:lk10
    pull_policy: never
    restart: unless-stopped
    environment:
      MLFLOW_MODELS_WORKERS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    ports:
    - target: 8080
      host_ip: 127.0.0.1
    deploy:
      replicas: 3
    depends_on:
      mlflow-server:
        condition: service_healthy
    networks:
    - model-network
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping',
        timeout=5)
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 24
    init: true
networks:
  model-network:
    driver: bridge
volumes:
  mlflow-data:
    name: manhwa-lk09_mlflow-data
