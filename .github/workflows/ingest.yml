name: Daily data ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "10 2 * * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run daily pipeline with live MangaDex metadata
        run: python -m src.run_pipeline --require-live-api
      - name: Keep the generated data as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chapter-sentiment-data-${{ github.run_id }}
          path: data/
          retention-days: 14
